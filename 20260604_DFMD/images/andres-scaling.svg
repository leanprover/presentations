<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="'Source Sans 3', -apple-system, sans-serif">
  <style>
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .axis { stroke: #1e293b; stroke-width: 1.5; }
    .tick-label { fill: #64748b; font-size: 24px; }
    .axis-title { fill: #1e293b; font-size: 28px; font-weight: 500; }
    .series-total { stroke: #0073A3; stroke-width: 4; fill: none; }
    .pt-total { fill: #0073A3; }
  </style>

  <!-- Grid -->
  <line class="grid" x1="90" y1="420" x2="670" y2="420"/>
  <line class="grid" x1="90" y1="333.6" x2="670" y2="333.6"/>
  <line class="grid" x1="90" y1="247.3" x2="670" y2="247.3"/>
  <line class="grid" x1="90" y1="160.9" x2="670" y2="160.9"/>
  <line class="grid" x1="90" y1="74.5" x2="670" y2="74.5"/>

  <!-- Axes -->
  <line class="axis" x1="90" y1="40" x2="90" y2="420"/>
  <line class="axis" x1="90" y1="420" x2="670" y2="420"/>

  <!-- Y tick labels -->
  <text class="tick-label" x="82" y="428" text-anchor="end">0</text>
  <text class="tick-label" x="82" y="341.6" text-anchor="end">500</text>
  <text class="tick-label" x="82" y="255.3" text-anchor="end">1000</text>
  <text class="tick-label" x="82" y="168.9" text-anchor="end">1500</text>
  <text class="tick-label" x="82" y="82.5" text-anchor="end">2000</text>

  <!-- X tick labels -->
  <text class="tick-label" x="90" y="450" text-anchor="middle">10</text>
  <text class="tick-label" x="154.44" y="450" text-anchor="middle">20</text>
  <text class="tick-label" x="218.89" y="450" text-anchor="middle">30</text>
  <text class="tick-label" x="283.33" y="450" text-anchor="middle">40</text>
  <text class="tick-label" x="347.78" y="450" text-anchor="middle">50</text>
  <text class="tick-label" x="412.22" y="450" text-anchor="middle">60</text>
  <text class="tick-label" x="476.67" y="450" text-anchor="middle">70</text>
  <text class="tick-label" x="541.11" y="450" text-anchor="middle">80</text>
  <text class="tick-label" x="605.56" y="450" text-anchor="middle">90</text>
  <text class="tick-label" x="670" y="450" text-anchor="middle">100</text>

  <!-- Axis titles -->
  <text class="axis-title" x="380" y="478" text-anchor="middle">Goal size</text>
  <text class="axis-title" x="22" y="230" text-anchor="middle" transform="rotate(-90 22 230)">Time (ms)</text>

  <!-- Tactics line -->
  <polyline class="series-total" points="90,404.75 154.44,387.87 218.89,369.03 283.33,343.41 347.78,305.12 412.22,271.77 476.67,229.30 541.11,179.93 605.56,109.27 670,61.92"/>

  <!-- Tactics points -->
  <circle class="pt-total" cx="90" cy="404.75" r="5"/>
  <circle class="pt-total" cx="154.44" cy="387.87" r="5"/>
  <circle class="pt-total" cx="218.89" cy="369.03" r="5"/>
  <circle class="pt-total" cx="283.33" cy="343.41" r="5"/>
  <circle class="pt-total" cx="347.78" cy="305.12" r="5"/>
  <circle class="pt-total" cx="412.22" cy="271.77" r="5"/>
  <circle class="pt-total" cx="476.67" cy="229.30" r="5"/>
  <circle class="pt-total" cx="541.11" cy="179.93" r="5"/>
  <circle class="pt-total" cx="605.56" cy="109.27" r="5"/>
  <circle class="pt-total" cx="670" cy="61.92" r="5"/>
</svg>
